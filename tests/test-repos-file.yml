name: Test repos-file input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create repos file
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/repos.md" << 'EOF'
          - scala-steward-org/scala-steward
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          repos-file: "${{ github.workspace }}/tests/fixtures/repos.md"
          do-not-fork: "true"
          cache-ttl: "0s"
          timeout: "5min"

      - name: Assert action ran (succeeded or failed gracefully)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected with sentinel repo or network)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
