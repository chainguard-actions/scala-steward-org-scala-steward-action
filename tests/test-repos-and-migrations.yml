name: Test repos-file and migrations inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create fixture files
        run: |
          mkdir -p /tmp/scala-steward-test
          echo "- example/repo1" > /tmp/scala-steward-test/repos.md
          echo "- example/repo2" >> /tmp/scala-steward-test/repos.md
          echo '{ migrations: [] }' > /tmp/scala-steward-test/artifact-migrations.conf
          echo '{ migrations: [] }' > /tmp/scala-steward-test/scalafix-migrations.conf
          echo "/tmp/extra-jars-dir" > /dev/null
          mkdir -p /tmp/extra-jars-dir
      - id: action
        uses: .
        continue-on-error: true
        with:
          repos-file: "/tmp/scala-steward-test/repos.md"
          other-args: "--disable-sandbox"
          extra-jars: "/tmp/extra-jars-dir"
          artifact-migrations: "/tmp/scala-steward-test/artifact-migrations.conf"
          scalafix-migrations: "/tmp/scala-steward-test/scalafix-migrations.conf"
          github-token: "fake-token-for-input-coverage"
      - name: Assert action was invoked with repos and migrations inputs
        run: |
          echo "Action step completed (may have failed due to fake token, which is expected)"
          echo "PASS: inputs were accepted by the action"
