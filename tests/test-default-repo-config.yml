name: Test default repo-config is handled gracefully
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          github-repository: ${{ github.repository }}
          # repo-config defaults to .github/.scala-steward.conf which may not exist
          # The action should NOT fail due to the missing default config file

      - name: Assert action did not fail due to default repo-config validation
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action is expected to fail in this test environment (no real Scala Steward setup),
          # but it should NOT fail with "Provided default repo conf file does not exist" error
          # because the default path (.github/.scala-steward.conf) is exempt from that check.
          # We verify the action ran (outcome is set, not skipped).
          if [ -z "$OUTCOME" ]; then
            echo "FAIL: action outcome was not set"
            exit 1
          fi
          echo "PASS: action ran with default repo-config (outcome: $OUTCOME)"
