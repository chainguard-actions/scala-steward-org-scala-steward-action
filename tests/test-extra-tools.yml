name: Test extra-jars and mill-wrapper-url inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a dummy extra jar directory
        run: |
          mkdir -p "$GITHUB_WORKSPACE/hardened/tests/fixtures/extra-jars"

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          do-not-fork: "true"
          cache-ttl: "0s"
          timeout: "5min"
          extra-jars: "${{ github.workspace }}/hardened/tests/fixtures/extra-jars"
          mill-wrapper-url: "https://raw.githubusercontent.com/lefou/millw/0.4.11/millw"

      - name: Assert action ran (succeeded or failed gracefully on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected with sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
