name: Test versions and branches inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create repos file
        run: |
          mkdir -p "$GITHUB_WORKSPACE/hardened/tests/fixtures"
          echo "- scala-steward-org/scala-steward" > "$GITHUB_WORKSPACE/hardened/tests/fixtures/repos.md"
      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          repos-file: hardened/tests/fixtures/repos.md
          do-not-fork: "true"
          cache-ttl: 0s
          branches: main
          scala-steward-version: "0.22.0"
          scalafmt-version: "3.7.17"
          scala-cli-version: "1.0.0"
          sbt-version: "1.9.7"
      - name: Assert action ran with versions and branches (success or graceful failure)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected under sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
