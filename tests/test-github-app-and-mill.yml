name: Test GitHub App and mill-wrapper-url inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          github-app-id: "12345"
          github-app-installation-id: "67890"
          github-app-key: "fake-key-for-input-coverage"
          mill-wrapper-url: "https://raw.githubusercontent.com/lefou/millw/main/millw"
          do-not-fork: "true"

      - name: Assert action ran (inputs accepted or failed gracefully on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with github-app-id, github-app-installation-id, github-app-key, and mill-wrapper-url inputs"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
