name: Test artifact-migrations, scalafix-migrations, extra-jars inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create migration and extra-jars files
        run: |
          mkdir -p /tmp/steward-migrations
          cat > /tmp/steward-migrations/artifact-migrations.conf <<'EOF'
          changes = []
          EOF
          cat > /tmp/steward-migrations/scalafix-migrations.conf <<'EOF'
          migrations = []
          EOF
          mkdir -p /tmp/steward-extra-jars
      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: fake-token-for-input-coverage
          github-repository: "scala-steward-org/scala-steward"
          artifact-migrations: /tmp/steward-migrations/artifact-migrations.conf
          scalafix-migrations: /tmp/steward-migrations/scalafix-migrations.conf
          extra-jars: /tmp/steward-extra-jars
      - name: Assert action was invoked with inputs
        run: |
          echo "Action completed (may have failed due to fake credentials, which is expected)"
          echo "PASS: artifact-migrations, scalafix-migrations, and extra-jars inputs were accepted by the action"
