name: Test migrations and other-args inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create artifact migrations file
        run: |
          mkdir -p /tmp/steward-config
          cat > /tmp/steward-config/artifact-migrations.conf <<'EOF'
          migrations = []
          EOF
          cat > /tmp/steward-config/scalafix-migrations.conf <<'EOF'
          migrations = []
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          artifact-migrations: /tmp/steward-config/artifact-migrations.conf
          scalafix-migrations: /tmp/steward-config/scalafix-migrations.conf
          other-args: "--help"
          do-not-fork: "true"

      - name: Assert action ran (inputs accepted or failed gracefully on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with artifact-migrations, scalafix-migrations, and other-args inputs"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
