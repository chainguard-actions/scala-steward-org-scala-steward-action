name: Test migrations and other-args inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create migration fixture files
        run: |
          mkdir -p "$GITHUB_WORKSPACE/hardened/tests/fixtures"
          cat > "$GITHUB_WORKSPACE/hardened/tests/fixtures/artifact-migrations.conf" << 'EOF'
          changes = []
          EOF
          cat > "$GITHUB_WORKSPACE/hardened/tests/fixtures/scalafix-migrations.conf" << 'EOF'
          migrations = []
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          do-not-fork: "true"
          cache-ttl: "0s"
          timeout: "5min"
          artifact-migrations: "${{ github.workspace }}/hardened/tests/fixtures/artifact-migrations.conf"
          scalafix-migrations: "${{ github.workspace }}/hardened/tests/fixtures/scalafix-migrations.conf"
          other-args: "--disable-sandbox"

      - name: Assert action ran (succeeded or failed gracefully on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected with sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
