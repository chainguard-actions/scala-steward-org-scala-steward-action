name: Test cache-ttl and timeout inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create repos file
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures"
          echo "- scala-steward-org/scala-steward" > "$GITHUB_WORKSPACE/tests/fixtures/repos.md"
      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          repos-file: tests/fixtures/repos.md
          cache-ttl: 0s
          timeout: 5min
          max-buffer-size: "8192"
          do-not-fork: "true"
      - name: Assert action ran with custom cache-ttl and timeout (success or graceful failure)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with custom cache-ttl and timeout"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected under sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
