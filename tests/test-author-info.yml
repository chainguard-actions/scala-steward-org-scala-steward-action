name: Test author-email and author-name inputs are accepted
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          github-repository: ${{ github.repository }}
          author-email: "scala-steward@example.com"
          author-name: "Scala Steward Bot"

      - name: Assert action ran with author info inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action may fail for other reasons (e.g. Coursier install, network, etc.)
          # but it should NOT fail due to author-email or author-name validation.
          if [ -z "$OUTCOME" ]; then
            echo "FAIL: action outcome was not set"
            exit 1
          fi
          echo "PASS: action ran with author-email and author-name inputs (outcome: $OUTCOME)"
