name: Test GitHub App partial inputs validation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REPOSITORY: test-owner/test-repo
      GITHUB_API_URL: https://api.github.com
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: fake-token-for-testing
          github-repository: test-owner/test-repo
          # Provide github-app-id without github-app-key.
          # Per the action's input validation logic, both must be set together.
          # This should cause: "`github-app-id` and `github-app-key` inputs have to be set together"
          github-app-id: "12345"

      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because either:
          # 1. github-app-id is set without github-app-key (input validation error), or
          # 2. Maven Central is unreachable / Coursier install fails (network error)
          # In both cases the action must fail, not succeed.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed"
          else
            echo "FAIL: expected action to fail but got outcome: $OUTCOME"
            exit 1
          fi
