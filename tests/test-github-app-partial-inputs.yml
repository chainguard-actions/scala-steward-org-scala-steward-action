name: Test GitHub App partial inputs error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          github-repository: ${{ github.repository }}
          # Provide only github-app-id without github-app-key — should fail
          github-app-id: "12345"

      - name: Assert action failed with partial GitHub App inputs error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when only github-app-id is set without github-app-key"
            exit 1
          fi
          echo "PASS: action correctly failed when GitHub App inputs are incomplete"
