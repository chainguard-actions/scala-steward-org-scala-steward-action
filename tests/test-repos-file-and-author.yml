name: Test repos-file, author, branches, scala-steward-version, other-args inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create repos file
        run: |
          mkdir -p /tmp/steward-test
          echo "- scala-steward-org/scala-steward" > /tmp/steward-test/repos.md
      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: fake-token-for-input-coverage
          repos-file: /tmp/steward-test/repos.md
          scala-steward-version: "0.22.0"
          author-email: "steward@example.com"
          author-name: "Scala Steward Bot"
          branches: "main,develop"
          other-args: "--do-not-fork"
      - name: Assert action was invoked with inputs
        run: |
          echo "Action completed (may have failed due to fake credentials, which is expected)"
          echo "PASS: inputs were accepted by the action"
