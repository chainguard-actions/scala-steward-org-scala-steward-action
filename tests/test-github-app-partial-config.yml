name: Test GitHub App partial configuration error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: fake-token-for-testing
          github-api-url: https://api.github.com
          github-repository: scala-steward-org/scala-steward
          github-app-id: "12345"
          # github-app-key intentionally omitted to trigger validation error
          do-not-fork: "true"
          cache-ttl: "0s"

      - name: Assert action failed due to incomplete GitHub App config
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when github-app-id is set without github-app-key, got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when GitHub App config is incomplete"
