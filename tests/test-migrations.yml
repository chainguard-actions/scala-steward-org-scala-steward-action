name: Test artifact-migrations and scalafix-migrations inputs
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create migration fixture files
        run: |
          mkdir -p /tmp/scala-steward-migrations
          cat > /tmp/scala-steward-migrations/artifact-migrations.conf << 'EOF'
          changes = []
          EOF
          cat > /tmp/scala-steward-migrations/scalafix-migrations.conf << 'EOF'
          migrations = []
          EOF

      - name: Run action with artifact-migrations and scalafix-migrations inputs
        id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          github-repository: ${{ github.repository }}
          artifact-migrations: "/tmp/scala-steward-migrations/artifact-migrations.conf"
          scalafix-migrations: "/tmp/scala-steward-migrations/scalafix-migrations.conf"
          cache-ttl: 0s
          timeout: 2min

      - name: Assert action ran (not skipped)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action step was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with artifact-migrations and scalafix-migrations inputs (outcome: $OUTCOME)"
