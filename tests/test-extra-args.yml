name: Test other-args, extra-jars, and scala-steward-version inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REPOSITORY: scala-steward-org/scala-steward-action
      GITHUB_API_URL: https://api.github.com
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a dummy extra jar directory
        run: |
          mkdir -p /tmp/scala-steward-extra-jars
      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          github-repository: scala-steward-org/scala-steward-action
          scala-steward-version: "0.22.0"
          other-args: "--disable-sandbox"
          extra-jars: "/tmp/scala-steward-extra-jars"
          cache-ttl: 0s
          do-not-fork: "true"
      - name: Assert action ran (not cancelled)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action may fail due to network/token issues in act, but it should
          # not be cancelled. The other-args, extra-jars, and scala-steward-version
          # inputs should be accepted.
          if [ "$OUTCOME" = "cancelled" ]; then
            echo "FAIL: action was cancelled unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with outcome=$OUTCOME (other-args, extra-jars, scala-steward-version were accepted)"
