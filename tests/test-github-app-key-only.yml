name: Test GitHub App key-only inputs validation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          github-app-key: "fake-private-key-content"
          # github-app-id intentionally omitted to trigger validation error

      - name: Assert action failed with expected error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when github-app-key is set without github-app-id"
            exit 1
          fi
          echo "PASS: action correctly failed for partial GitHub App inputs (key only)"
