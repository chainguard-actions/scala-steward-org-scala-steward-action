name: Test extra-jars and mill-wrapper-url inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a fake extra JAR file
        run: |
          mkdir -p /tmp/extra-jars
          touch /tmp/extra-jars/fake-plugin.jar
      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          extra-jars: /tmp/extra-jars/fake-plugin.jar
          mill-wrapper-url: https://raw.githubusercontent.com/lefou/millw/main/millw
          do-not-fork: "true"
      - name: Assert action ran (inputs accepted or failed gracefully on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
