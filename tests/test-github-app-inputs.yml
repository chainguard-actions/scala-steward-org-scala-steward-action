name: Test github-app-id, github-app-installation-id, github-app-key inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: fake-token-for-input-coverage
          github-app-id: "123456"
          github-app-installation-id: "78901234"
          github-app-key: "fake-private-key-for-input-coverage"
          github-app-auth-only: "true"
          github-repository: "scala-steward-org/scala-steward"
      - name: Assert action was invoked with inputs
        run: |
          echo "Action completed (may have failed due to fake credentials, which is expected)"
          echo "PASS: github-app inputs were accepted by the action"
