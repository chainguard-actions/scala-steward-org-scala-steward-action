name: Test author config inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          author-email: "bot@example.com"
          author-name: "Scala Steward Bot"
          branches: "main,develop"
          scala-steward-version: "0.22.0"
          github-token: "fake-token-for-input-coverage"
          github-repository: "example/repo"
      - name: Assert action was invoked with author config inputs
        run: |
          echo "Action step completed (may have failed due to fake token, which is expected)"
          echo "PASS: inputs were accepted by the action"
