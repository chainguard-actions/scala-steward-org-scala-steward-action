name: Test author configuration inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create repos file
        run: |
          mkdir -p /tmp/scala-steward-test
          echo "- scala-steward-org/scala-steward" > /tmp/scala-steward-test/repos.md

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: fake-token-for-testing
          github-api-url: https://api.github.com
          repos-file: /tmp/scala-steward-test/repos.md
          do-not-fork: "true"
          cache-ttl: "0s"
          author-email: "steward@example.com"
          author-name: "Scala Steward Bot"
          scala-steward-version: "0.22.0"

      - name: Assert action ran with author config inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" = "cancelled" ]; then
            echo "FAIL: action was cancelled unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with outcome=$OUTCOME (failure expected due to fake token)"
