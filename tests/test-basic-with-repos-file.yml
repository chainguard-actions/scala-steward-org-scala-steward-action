name: Test basic usage with repos-file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create repos file
        run: |
          mkdir -p /tmp/scala-steward-test
          cat > /tmp/scala-steward-test/repos.md << 'EOF'
          - scala-steward-org/scala-steward-action
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          repos-file: /tmp/scala-steward-test/repos.md
          cache-ttl: 0s
          timeout: 1min

      - name: Assert action ran (passed input validation)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action may fail at the coursier install or Scala Steward run step
          # due to network/environment constraints, but it should NOT fail at input
          # validation since we provided a valid repos-file.
          # We accept both success and failure here, but not a crash before starting.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
