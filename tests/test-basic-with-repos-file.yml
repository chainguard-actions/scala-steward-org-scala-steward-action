name: Test basic usage with repos-file
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create repos file
        run: |
          mkdir -p /tmp/steward-test
          cat > /tmp/steward-test/repos.md << 'EOF'
          - scala-steward-org/scala-steward-action
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          repos-file: /tmp/steward-test/repos.md

      - name: Assert action did not fail on input validation
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action is expected to fail because it tries to install Coursier
          # and run Scala Steward (network operations not available in test env),
          # but it should NOT fail due to input validation errors.
          # We verify the outcome is either success or failure (not a setup error).
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (outcome=$OUTCOME), input validation passed"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
