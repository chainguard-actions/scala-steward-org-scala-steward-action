name: Test custom configuration options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REPOSITORY: scala-steward-org/scala-steward-action
      GITHUB_API_URL: https://api.github.com
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          github-token: fake-token-for-testing
          github-repository: scala-steward-org/scala-steward-action
          do-not-fork: "true"
          sign-commits: "false"
          ignore-opts-files: "true"
          cache-ttl: 0s
          timeout: 1min
          max-buffer-size: "8192"
          author-name: "Test Bot"
          author-email: "test-bot@example.com"
        continue-on-error: true
      - name: Assert action ran with custom config
        run: |
          echo "Action step outcome: ${{ steps.action.outcome }}"
          OUTCOME="${{ steps.action.outcome }}"
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action step was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action step was executed with outcome: $OUTCOME"
