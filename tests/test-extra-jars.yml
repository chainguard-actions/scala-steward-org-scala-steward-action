name: Test extra-jars input
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a dummy extra jar directory
        run: |
          mkdir -p /tmp/scala-steward-extra-jars

      - name: Run action with extra-jars input
        id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          github-repository: ${{ github.repository }}
          extra-jars: "/tmp/scala-steward-extra-jars"
          cache-ttl: 0s
          timeout: 2min

      - name: Assert action ran (not skipped)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action step was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with extra-jars input (outcome: $OUTCOME)"
