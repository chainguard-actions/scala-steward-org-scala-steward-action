name: Test extra optional inputs (artifact-migrations, scalafix-migrations, other-args)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create dummy migration files
        run: |
          echo '{ migrations: [] }' > /tmp/artifact-migrations.conf
          echo '{ migrations: [] }' > /tmp/scalafix-migrations.conf

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          github-repository: ${{ github.repository }}
          do-not-fork: "true"
          cache-ttl: 0s
          timeout: 1min
          artifact-migrations: /tmp/artifact-migrations.conf
          scalafix-migrations: /tmp/scalafix-migrations.conf
          other-args: "--help"

      - name: Assert action step was executed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action step was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action step was executed with outcome: $OUTCOME"
