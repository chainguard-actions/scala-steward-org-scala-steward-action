name: Test empty github-repository fails validation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          github-repository: ""
          # No repos-file provided either, so githubRepository() will be called
          # and should throw because the input is empty

      - name: Assert action failed with empty github-repository error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when github-repository is empty and no repos-file is provided"
            exit 1
          fi
          echo "PASS: action correctly failed when github-repository is empty"
