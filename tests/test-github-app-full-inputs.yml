name: Test GitHub App full inputs (installation-id and key)
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with full GitHub App inputs (invalid credentials)
        id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          github-repository: ${{ github.repository }}
          github-app-id: "99999"
          github-app-installation-id: "88888"
          github-app-key: |
            -----BEGIN RSA PRIVATE KEY-----
            MIIEowIBAAKCAQEA0Z3VS5JJcds3xHn/ygWep4PAtEsHAcCMNaFrAqMbBMbZbMFB
            FAKE_KEY_FOR_TESTING_ONLY_NOT_A_REAL_KEY_DO_NOT_USE_IN_PRODUCTION
            -----END RSA PRIVATE KEY-----
          cache-ttl: 0s
          timeout: 2min

      - name: Assert action ran (step was executed)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # The action should fail because the GitHub App credentials are invalid.
          # It should NOT be skipped.
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action step was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action step was executed (outcome: ${{ steps.action.outcome }})"
