name: Test GitHub App full inputs are accepted
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          github-app-id: "12345"
          github-app-installation-id: "67890"
          github-app-key: |
            -----BEGIN RSA PRIVATE KEY-----
            MIIEowIBAAKCAQEA0Z3VS5JJcds3xHn/ygWep4PAtEsHAFOKkJ7IOQQ0GBFrMOBx
            FAKE KEY FOR TESTING PURPOSES ONLY NOT A REAL KEY
            -----END RSA PRIVATE KEY-----

      - name: Assert action ran with GitHub App full inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ -z "$OUTCOME" ]; then
            echo "FAIL: action outcome was not set"
            exit 1
          fi
          # The action is expected to fail because the GitHub App credentials are fake,
          # but it should have accepted all three inputs without an input-validation error.
          echo "PASS: action ran with github-app-id, github-app-installation-id, and github-app-key inputs (outcome: $OUTCOME)"
