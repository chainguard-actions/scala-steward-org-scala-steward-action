name: Test tool versions, branches, and extra-jars inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create extra jars directory
        run: |
          mkdir -p /tmp/ss-extra-jars

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          github-repository: ${{ github.repository }}
          branches: "main"
          extra-jars: /tmp/ss-extra-jars
          scalafmt-version: "3.8.1"
          sbt-version: "1.9.9"
          scala-cli-version: "1.5.0"
          do-not-fork: "true"

      - name: Assert action ran (success or graceful failure on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with branches, extra-jars, scalafmt-version, sbt-version, and scala-cli-version inputs"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
