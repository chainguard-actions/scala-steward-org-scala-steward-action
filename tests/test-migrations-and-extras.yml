name: Test migrations and extra-jars inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REPOSITORY: scala-steward-org/scala-steward-action
      GITHUB_EVENT_NAME: workflow_dispatch
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create migration and extra-jars fixture files
        run: |
          mkdir -p /tmp/steward-migrations
          cat > /tmp/steward-migrations/scalafix-migrations.conf << 'EOF'
          migrations = []
          EOF
          cat > /tmp/steward-migrations/artifact-migrations.conf << 'EOF'
          changes = []
          EOF
          mkdir -p /tmp/steward-extra-jars
          echo "placeholder" > /tmp/steward-extra-jars/placeholder.txt
          echo "Created migration and extra-jars fixture files"
      - name: Run Scala Steward action with migrations and extra-jars inputs
        id: action
        continue-on-error: true
        uses: .
        with:
          github-token: ${{ github.token }}
          github-repository: scala-steward-org/scala-steward-action
          do-not-fork: "true"
          cache-ttl: 0s
          scalafix-migrations: /tmp/steward-migrations/scalafix-migrations.conf
          artifact-migrations: /tmp/steward-migrations/artifact-migrations.conf
          extra-jars: /tmp/steward-extra-jars
      - name: Assert action was invoked with migrations and extra-jars inputs
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action was invoked with migrations and extra-jars inputs (outcome: ${{ steps.action.outcome }})"
