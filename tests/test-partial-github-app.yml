name: Test partial GitHub App config causes failure
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with only github-app-id (missing github-app-key)
        id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          github-repository: ${{ github.repository }}
          github-app-id: "12345"
          cache-ttl: 0s
          timeout: 2min

      - name: Assert action failed due to incomplete GitHub App config
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail when github-app-id is set without github-app-key, got: ${{ steps.action.outcome }}"
            exit 1
          fi
          echo "PASS: action correctly failed with incomplete GitHub App configuration"
