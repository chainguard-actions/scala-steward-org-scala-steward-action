name: Test artifact-migrations, scalafix-migrations, and extra-jars inputs
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create artifact-migrations and scalafix-migrations fixture files
        run: |
          mkdir -p /tmp/scala-steward-fixtures
          cat > /tmp/scala-steward-fixtures/artifact-migrations.conf << 'EOF'
          changes = []
          EOF
          cat > /tmp/scala-steward-fixtures/scalafix-migrations.conf << 'EOF'
          migrations = []
          EOF
          mkdir -p /tmp/scala-steward-fixtures/extra-jars

      - name: Run action with artifact-migrations, scalafix-migrations, and extra-jars inputs
        id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          github-repository: ${{ github.repository }}
          artifact-migrations: "/tmp/scala-steward-fixtures/artifact-migrations.conf"
          scalafix-migrations: "/tmp/scala-steward-fixtures/scalafix-migrations.conf"
          extra-jars: "/tmp/scala-steward-fixtures/extra-jars"
          cache-ttl: 0s
          timeout: 2min

      - name: Assert action ran (step was executed)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # The action should either succeed or fail with a known error
          # (Coursier install, Scala Steward run, or network issue).
          # It should NOT be skipped.
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action step was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action step was executed (outcome: ${{ steps.action.outcome }})"
