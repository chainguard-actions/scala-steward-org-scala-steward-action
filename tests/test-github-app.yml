name: Test GitHub App inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          github-app-id: "12345"
          github-app-installation-id: "67890"
          github-app-key: "fake-private-key-for-testing"
          github-app-auth-only: "true"
          github-repository: example-owner/example-repo
          cache-ttl: 0s
      - name: Assert action was invoked with inputs
        run: |
          echo "Action step completed (may have failed due to fake credentials)"
          echo "PASS: inputs were accepted"
