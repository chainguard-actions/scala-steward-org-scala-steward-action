name: Test invalid repo-config input
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          repo-config: /nonexistent/path/.scala-steward.conf

      - name: Assert action failed with repo-config error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when non-default repo-config does not exist"
            exit 1
          fi
          echo "PASS: action correctly failed for non-existent repo-config"
