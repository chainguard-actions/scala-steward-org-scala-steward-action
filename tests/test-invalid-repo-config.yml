name: Test invalid repo-config path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: fake-token-for-testing
          github-api-url: https://api.github.com
          github-repository: scala-steward-org/scala-steward
          repo-config: /tmp/nonexistent-custom-config/.scala-steward.conf
          do-not-fork: "true"
          cache-ttl: "0s"

      - name: Assert action failed due to missing custom repo-config
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when custom repo-config does not exist, got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when custom repo-config does not exist"
