name: Test tool version inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REPOSITORY: scala-steward-org/scala-steward-action
      GITHUB_EVENT_NAME: workflow_dispatch
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run Scala Steward action with tool version inputs
        id: action
        continue-on-error: true
        uses: .
        with:
          github-token: ${{ github.token }}
          github-repository: scala-steward-org/scala-steward-action
          do-not-fork: "true"
          cache-ttl: 0s
          scala-steward-version: "0.22.0"
          scalafmt-version: "3.8.1"
          scala-cli-version: "1.4.1"
          sbt-version: "1.10.1"
      - name: Assert action was invoked with tool version inputs
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action was invoked with tool version inputs (outcome: ${{ steps.action.outcome }})"
