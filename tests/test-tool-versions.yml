name: Test tool version inputs are accepted
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          github-repository: ${{ github.repository }}
          scala-steward-version: "0.22.0"
          scalafmt-version: "3.8.1"
          sbt-version: "1.10.1"
          scala-cli-version: "1.4.1"

      - name: Assert action ran with tool version inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ -z "$OUTCOME" ]; then
            echo "FAIL: action outcome was not set"
            exit 1
          fi
          echo "PASS: action ran with tool version inputs (outcome: $OUTCOME)"
