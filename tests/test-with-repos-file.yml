name: Test with valid repos-file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REPOSITORY: test-owner/test-repo
      GITHUB_API_URL: https://api.github.com
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create repos file
        run: |
          mkdir -p /tmp/scala-steward-test
          cat > /tmp/scala-steward-test/repos.md << 'EOF'
          - test-owner/test-repo
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: fake-token-for-testing
          repos-file: /tmp/scala-steward-test/repos.md

      - name: Assert action ran (pass or fail gracefully)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action is expected to fail in a test environment (no real token,
          # Maven Central may be unreachable, or Coursier install may fail).
          # We verify it ran and produced a valid outcome (not a crash).
          # It should NOT fail due to repos-file not found since we created it.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran and produced a valid outcome: $OUTCOME"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
