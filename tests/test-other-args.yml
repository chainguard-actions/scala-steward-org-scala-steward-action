name: Test other-args input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create repos file
        run: |
          mkdir -p /tmp/scala-steward-test
          echo "- scala-steward-org/scala-steward" > /tmp/scala-steward-test/repos.md

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          github-api-url: https://api.github.com
          repos-file: /tmp/scala-steward-test/repos.md
          other-args: "--disable-sandbox"
          do-not-fork: "true"
          cache-ttl: "0s"

      - name: Assert action ran with other-args input (not cancelled)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action may fail due to network/auth but should not crash on input validation
          if [ "$OUTCOME" = "cancelled" ]; then
            echo "FAIL: action was cancelled unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with outcome=$OUTCOME (failure expected due to sentinel repo)"
