name: Test author, branches, other-args, and scala-steward-version inputs
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with author, branches, other-args, and scala-steward-version inputs
        id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          github-repository: ${{ github.repository }}
          author-email: "steward@example.com"
          author-name: "Scala Steward"
          branches: "main"
          other-args: "--help"
          scala-steward-version: "0.22.0"
          cache-ttl: 0s
          timeout: 2min

      - name: Assert action ran (step was executed)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # The action should either succeed or fail with a known error
          # (Coursier install, Scala Steward run, or network issue).
          # It should NOT be skipped.
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action step was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action step was executed (outcome: ${{ steps.action.outcome }})"
