name: Test GitHub App full configuration inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a fake RSA private key for testing
        run: |
          # Generate a fake RSA private key in PEM format for input validation testing
          openssl genrsa -out /tmp/fake-app-key.pem 2048 2>/dev/null || true
          # Fallback: create a minimal fake PEM if openssl is not available
          if [ ! -s /tmp/fake-app-key.pem ]; then
            printf -- '-----BEGIN RSA PRIVATE KEY-----\nMIIEowIBAAKCAQEA0Z3VS5JJcds3xHn/ygWep4PAtEsHAFPpF9+Y7LGCmqHMBMHm\n-----END RSA PRIVATE KEY-----\n' > /tmp/fake-app-key.pem
          fi

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          github-repository: scala-steward-org/scala-steward
          github-app-id: "99999"
          github-app-installation-id: "12345678"
          github-app-key: "-----BEGIN RSA PRIVATE KEY-----\nMIIEowIBAAKCAQEA0Z3VS5JJcds3xHn/ygWep4PAtEsHAFPpF9+Y7LGCmqHMBMHm\n-----END RSA PRIVATE KEY-----"
          github-app-auth-only: "true"
          do-not-fork: "true"
          cache-ttl: "0s"

      - name: Assert action ran with full GitHub App config inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action will fail because the GitHub App credentials are fake,
          # but it should not crash due to missing input validation for
          # github-app-installation-id or github-app-key.
          # We expect failure (auth error) not cancellation (setup error).
          if [ "$OUTCOME" = "cancelled" ]; then
            echo "FAIL: action was cancelled unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with outcome=$OUTCOME (github-app-installation-id, github-app-key inputs accepted)"
