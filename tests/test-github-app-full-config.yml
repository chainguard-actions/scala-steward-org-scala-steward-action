name: Test GitHub App full configuration inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: fake-token-for-testing
          github-api-url: https://api.github.com
          github-repository: scala-steward-org/scala-steward
          github-app-id: "12345"
          github-app-installation-id: "67890"
          github-app-key: "fake-private-key-for-testing"
          do-not-fork: "true"
          cache-ttl: "0s"

      - name: Assert action ran with full GitHub App config inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" = "cancelled" ]; then
            echo "FAIL: action was cancelled unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with outcome=$OUTCOME (failure expected due to fake credentials)"
