name: Test artifact-migrations and scalafix-migrations inputs are accepted
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create migration fixture files
        run: |
          mkdir -p "$GITHUB_WORKSPACE/hardened/tests/fixtures/migrations"
          cat > "$GITHUB_WORKSPACE/hardened/tests/fixtures/migrations/artifact-migrations.conf" <<'EOF'
          migrations = []
          EOF
          cat > "$GITHUB_WORKSPACE/hardened/tests/fixtures/migrations/scalafix-migrations.conf" <<'EOF'
          migrations = []
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          github-repository: ${{ github.repository }}
          artifact-migrations: "hardened/tests/fixtures/migrations/artifact-migrations.conf"
          scalafix-migrations: "hardened/tests/fixtures/migrations/scalafix-migrations.conf"

      - name: Assert action ran with migration file inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ -z "$OUTCOME" ]; then
            echo "FAIL: action outcome was not set"
            exit 1
          fi
          echo "PASS: action ran with artifact-migrations and scalafix-migrations inputs (outcome: $OUTCOME)"
