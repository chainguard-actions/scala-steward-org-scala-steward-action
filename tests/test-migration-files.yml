name: Test artifact-migrations and scalafix-migrations inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create repos file and migration files
        run: |
          mkdir -p /tmp/steward-migrations-test

          echo "- scala-steward-org/scala-steward" > /tmp/steward-migrations-test/repos.md

          cat > /tmp/steward-migrations-test/artifact-migrations.conf << 'EOF'
          migrations = []
          EOF

          cat > /tmp/steward-migrations-test/scalafix-migrations.conf << 'EOF'
          migrations = []
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          repos-file: /tmp/steward-migrations-test/repos.md
          artifact-migrations: /tmp/steward-migrations-test/artifact-migrations.conf
          scalafix-migrations: /tmp/steward-migrations-test/scalafix-migrations.conf
          do-not-fork: "true"
          cache-ttl: "0s"

      - name: Assert action ran with migration file inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action may fail due to network/auth constraints in the test environment,
          # but it should not crash due to input validation errors for these inputs.
          if [ "$OUTCOME" = "cancelled" ]; then
            echo "FAIL: action was cancelled unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with outcome=$OUTCOME (artifact-migrations, scalafix-migrations inputs accepted)"
