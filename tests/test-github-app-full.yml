name: Test GitHub App full inputs (id, installation-id, key)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          github-app-id: "12345"
          github-app-installation-id: "67890"
          github-app-key: "-----BEGIN RSA PRIVATE KEY-----\nfakekey\n-----END RSA PRIVATE KEY-----"
          cache-ttl: 0s

      - name: Assert action ran (not cancelled)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action will fail because the GitHub App credentials are fake,
          # but it should not be cancelled. All three github-app-* inputs should
          # be accepted and the action should attempt authentication.
          if [ "$OUTCOME" = "cancelled" ]; then
            echo "FAIL: action was cancelled unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with outcome=$OUTCOME (github-app-installation-id was accepted)"
