name: Test GitHub App full inputs including installation-id
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REPOSITORY: scala-steward-org/scala-steward-action
      GITHUB_EVENT_NAME: workflow_dispatch
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run Scala Steward action with GitHub App installation-id input
        id: action
        continue-on-error: true
        uses: .
        with:
          github-token: ${{ github.token }}
          github-repository: scala-steward-org/scala-steward-action
          do-not-fork: "true"
          cache-ttl: 0s
          github-app-id: "12345"
          github-app-installation-id: "67890"
          github-app-key: "fake-key-for-input-coverage"
          github-app-auth-only: "true"
      - name: Assert action was invoked with github-app-installation-id input
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action was invoked with github-app-installation-id input (outcome: ${{ steps.action.outcome }})"
