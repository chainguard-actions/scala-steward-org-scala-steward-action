name: Test full GitHub App inputs (id, installation-id, key)
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with full GitHub App inputs
        id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          github-repository: ${{ github.repository }}
          github-app-id: "12345"
          github-app-installation-id: "67890"
          github-app-key: |
            -----BEGIN RSA PRIVATE KEY-----
            MIIEowIBAAKCAQEA0Z3VS5JJcds3xHn/ygWep4PAtEsHAFKFHiJMBMHFBMBHFMBH
            FMBHFMBHFMBHFMBHFMBHFMBHFMBHFMBHFMBHFMBHFMBHFMBHFMBHFMBHFMBHFMBh
            -----END RSA PRIVATE KEY-----
          cache-ttl: 0s
          timeout: 2min

      - name: Assert action failed gracefully (invalid app credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because the GitHub App credentials are fake.
          # We verify it ran and failed gracefully (not skipped).
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action step was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with github-app-installation-id and github-app-key inputs (outcome: $OUTCOME)"
