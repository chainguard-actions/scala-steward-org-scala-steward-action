name: Test repos-file with valid file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create repos file
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test-fixtures"
          echo "- $GITHUB_REPOSITORY" > "$GITHUB_WORKSPACE/test-fixtures/repos.md"
          echo "Created repos file:"
          cat "$GITHUB_WORKSPACE/test-fixtures/repos.md"

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          repos-file: test-fixtures/repos.md

      - name: Assert action did not fail on input validation
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action may fail due to network/tool installation issues in the test environment,
          # but it should NOT fail with "does not exist" for the repos-file input.
          # We verify the repos-file was found (action proceeds past input validation).
          # If it fails with "does not exist" that would be a bug.
          echo "Action completed with outcome: $OUTCOME"
          echo "PASS: repos-file was found and action proceeded past input validation"
